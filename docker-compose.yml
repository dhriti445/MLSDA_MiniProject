# docker compose up --build            (clean clone -> working system on http://localhost:8000)
# docker compose up --scale agent-worker=3
x-app: &app
  build: .
  env_file: [.env]
  environment: &env
    REDIS_URL: redis://redis:6379/0
    INDEX_PATH: /data/index.json
    QUARANTINE_PATH: /data/quarantine.jsonl
    CORPUS_DIR: /app/corpus
  volumes: ["data:/data"]

services:
  redis:                       # queue + run store + cache + rate-limit counters
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}

  indexer:                     # one-shot job: idempotent corpus -> index (D2). Re-run any time: docker compose run --rm indexer
    <<: *app
    command: python -m ecs.ingest
    restart: "no"

  api:                         # I/O-bound, stateless, scaled independently of the workers
    <<: *app
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      indexer: {condition: service_completed_successfully}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 5}

  agent-worker:                # CPU/LLM-bound; scale with --scale agent-worker=N; crash-isolated from the API
    <<: *app
    command: python -m services.worker.main
    depends_on:
      redis: {condition: service_healthy}
      indexer: {condition: service_completed_successfully}

  llm-stub:                    # D6: fixed responses after a realistic delay. Point LLM_BASE_URL at http://llm-stub:8001/v1 for load tests
    <<: *app
    command: uvicorn services.llm_stub.main:app --host 0.0.0.0 --port 8001
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health')"], interval: 10s, timeout: 3s, retries: 5}

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:latest
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me}"}
    volumes: ["./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes: {data: {}}
